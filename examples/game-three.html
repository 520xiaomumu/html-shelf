<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>三格连珠</title>
  <link rel="stylesheet" href="common.css">
  <style>
    #board{display:grid;grid-template-columns:repeat(3,72px);gap:8px;margin:16px 0}
    #board button{width:72px;height:72px;font-size:28px;background:#fff;color:#3b2f2a;border:1px solid #d9cbb8}
  </style>
</head>
<body>
  <main>
    <span class="tag">游戏</span>
    <h1>三格连珠</h1>
    <p>两人轮流落子，横竖斜连成三格即胜。原创占位小游戏，不是任何商业作品的复制。</p>
    <div id="board"></div>
    <p class="status" id="msg">轮到 ○</p>
    <button id="again" type="button">再来一局</button>
  </main>
  <script src="game-three.js"></script>
</body>
</html>
